name: Build Slim code-server + Antigravity (amd64)

on:
  workflow_dispatch:
    inputs:
      code_server_version:
        description: "coder/code-server 版本号（例如 4.145.2）"
        required: false
        default: "4.145.2"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Fetch upstream Antigravity patch scripts
        run: |
          rm -rf upstream
          git clone --depth 1 https://github.com/Scluzlep/code-server-tools.git upstream

      - name: Set lowercase image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/code-server-agy-slim" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CODE_SERVER_VERSION=${{ github.event.inputs.code_server_version || '4.145.2' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.event.inputs.code_server_version || '4.145.2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
